name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TVCast-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar na aba Releases
        if: github.ref == 'refs/heads/main'
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          TAG="v$VER"
          cp android/app/build/outputs/apk/debug/app-debug.apk "TVCast-$TAG.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "TVCast-$TAG.apk" --clobber
          else
            gh release create "$TAG" "TVCast-$TAG.apk" --target "$GITHUB_SHA" --title "TV Cast $VER" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
