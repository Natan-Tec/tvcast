name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TVCast-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar na aba Releases
        if: github.ref == 'refs/heads/main'
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          TAG="1.0"
          cp android/app/build/outputs/apk/debug/app-debug.apk TVCast.apk
          zip -rq TVCast-Server.zip server.py requirements.txt run.bat run.sh README.md web
          # mantém a tag 1.0 sempre no commit mais recente
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TVCast.apk TVCast-Server.zip --clobber
          else
            gh release create "$TAG" TVCast.apk TVCast-Server.zip --title "TV Cast" --notes "APK mais recente do TV Cast."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
