<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Cast</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none;
    font-family: Arial, Helvetica, sans-serif; color: #fff; }
  #img, #vid { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000; display: none; }
  #idle { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #idle h1 { font-size: 64px; margin: 0 0 14px 0; letter-spacing: 2px; }
  #idle p { font-size: 26px; margin: 0; color: #9aa4b2; }
  #dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%;
    background: #e5534b; margin-right: 10px; }
  #dot.on { background: #33c27f; }
  #msg { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 28px;
    background: rgba(0,0,0,.7); padding: 12px; display: none; }
</style>
</head>
<body>
<img id="img" alt="">
<video id="vid" playsinline></video>
<div id="idle">
  <h1>TV Cast</h1>
  <p><span id="dot"></span><span id="idleText">Procurando o PC...</span></p>
</div>
<div id="msg"></div>
<script>
(function () {
  var img = document.getElementById('img');
  var vid = document.getElementById('vid');
  var idle = document.getElementById('idle');
  var dot = document.getElementById('dot');
  var idleText = document.getElementById('idleText');
  var msg = document.getElementById('msg');
  var ws = null, cur = { mode: 'blank' }, msgTimer = null;

  function show(el, on) { el.style.display = on ? (el === idle ? 'flex' : 'block') : 'none'; }

  function toast(t) {
    msg.textContent = t; msg.style.display = 'block';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { msg.style.display = 'none'; }, 6000);
  }

  function send(o) { try { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); } catch (e) {} }

  function clearMedia() {
    img.onerror = null;
    img.removeAttribute('src'); show(img, false);
    try { vid.pause(); } catch (e) {}
    vid.removeAttribute('src'); try { vid.load(); } catch (e) {}
    show(vid, false);
  }

  function apply(s) {
    cur = s;
    clearMedia();
    if (s.mode === 'screen' || s.mode === 'window') {
      show(idle, false); show(img, true);
      img.onerror = function () {
        setTimeout(function () {
          if (cur === s) img.src = s.url + '&x=' + Date.now();
        }, 1000);
      };
      img.src = s.url;
    } else if (s.mode === 'image') {
      show(idle, false); show(img, true); img.src = s.url;
    } else if (s.mode === 'video') {
      show(idle, false); show(vid, true);
      vid.src = s.url;
      var p = vid.play();
      if (p && p.catch) p.catch(function () { vid.muted = true; vid.play(); });
    } else {
      show(idle, true);
    }
  }

  vid.addEventListener('error', function () {
    var m = 'Este vídeo não abre na TV (use MP4 H.264 ou WebM).';
    toast(m); send({ type: 'error', msg: m });
  });

  function control(c) {
    if (cur.mode !== 'video') return;
    var a = c.action, v = Number(c.value);
    if (a === 'play') vid.play();
    else if (a === 'pause') vid.pause();
    else if (a === 'toggle') { if (vid.paused) vid.play(); else vid.pause(); }
    else if (a === 'seek') vid.currentTime = v;
    else if (a === 'skip') vid.currentTime = Math.max(0, vid.currentTime + v);
    else if (a === 'volume') { vid.muted = false; vid.volume = Math.min(1, Math.max(0, v)); }
    else if (a === 'mute') vid.muted = !vid.muted;
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws?role=tv');
    ws.onopen = function () {
      dot.className = 'on'; idleText.textContent = 'Conectado ao PC. Aguardando...';
    };
    ws.onmessage = function (e) {
      var d; try { d = JSON.parse(e.data); } catch (x) { return; }
      if (d.type === 'state') apply(d.state);
      else if (d.type === 'control') control(d);
    };
    ws.onclose = function () {
      dot.className = ''; idleText.textContent = 'Procurando o PC...';
      setTimeout(connect, 2000);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  setInterval(function () {
    if (cur.mode === 'video') {
      send({ type: 'progress', t: vid.currentTime || 0, d: isFinite(vid.duration) ? vid.duration : 0,
             paused: vid.paused, volume: vid.muted ? 0 : vid.volume });
    }
  }, 1000);

  connect();
})();
</script>
</body>
</html>
