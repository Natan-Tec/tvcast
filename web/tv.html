<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Cast</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none;
    font-family: Arial, Helvetica, sans-serif; color: #fff; }
  #img, #vid, #bgvid { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000; display: none; }
  #idle { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #idle h1 { font-size: 64px; margin: 0 0 14px 0; letter-spacing: 2px; }
  #idle p { font-size: 26px; margin: 0; color: #9aa4b2; }
  #dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%;
    background: #e5534b; margin-right: 10px; }
  #dot.on { background: #33c27f; }
  #badge { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: none;
    padding: 8px 20px; border-radius: 22px; background: rgba(0,0,0,.72); font-size: 20px;
    letter-spacing: 1px; white-space: nowrap; z-index: 50; }
  #badge i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 10px;
    background: #e5534b; }
  #badge.ok i { background: #33c27f; }
  #msg { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 28px;
    background: rgba(0,0,0,.7); padding: 12px; display: none; }
  #lyr { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none;
    align-items: center; justify-content: center; text-align: center; }
  #lyrIn { display: inline-block; max-width: 92%; font-weight: bold; color: #fff; line-height: 1.25;
    white-space: pre-wrap; word-wrap: break-word;
    text-shadow: 0 0 8px #000, 0 0 16px #000, 2px 2px 4px #000, -2px -2px 4px #000; }
</style>
</head>
<body>
<style id="customCss"></style>
<video id="bgvid" playsinline loop muted></video>
<img id="img" alt="">
<video id="vid" playsinline></video>
<iframe id="frame" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#000;display:none"></iframe>
<div id="idle">
  <h1>TV Cast</h1>
  <p><span id="dot"></span><span id="idleText">Procurando o PC...</span></p>
</div>
<div id="lyr"><div id="lyrIn"></div></div>
<div id="badge"><i></i><span id="badgeText"></span></div>
<div id="msg"></div>
<script>
(function () {
  var img = document.getElementById('img');
  var vid = document.getElementById('vid');
  var idle = document.getElementById('idle');
  var dot = document.getElementById('dot');
  var idleText = document.getElementById('idleText');
  var msg = document.getElementById('msg');
  var ws = null, cur = { mode: 'blank' }, msgTimer = null;
  var bgvid = document.getElementById('bgvid');
  var bg = null, bgUrl = '';
  var LITE = /[?&]lite=1/.test(location.search);   // monitor leve: sem vídeo de fundo
  var lyr = document.getElementById('lyr'), lyrIn = document.getElementById('lyrIn');
  var lyrOn = false, lyrScale = 1;
  var frame = document.getElementById('frame');
  var customCss = document.getElementById('customCss');
  var curCss = '', pageShown = false;
  // No app da TV a página abre numa tela nativa (sem bloqueio de iframe e com CSS injetado).
  var NATIVE = (typeof window.Android !== 'undefined') && (typeof window.Android.showUrl === 'function');

  // Selo "TV CAST" + status da conexão (auto: some depois de 5 s, mas fica se cair; always; never).
  var connected = false, badgeMode = 'auto', badgeUntil = 0, badgeTimer = null;
  try { badgeMode = localStorage.getItem('tvBadge') || 'auto'; } catch (e) {}
  var badgeEl = document.getElementById('badge'), badgeText = document.getElementById('badgeText');
  var NATIVE_BADGE = (typeof window.Android !== 'undefined') && (typeof window.Android.setBadge === 'function');

  function renderBadge() {
    var text = connected ? 'TV CAST \u00b7 Conectado' : 'TV CAST \u00b7 Reconectando ao PC...';
    var visible = badgeMode === 'always' || (badgeMode === 'auto' && (!connected || Date.now() < badgeUntil));
    if (NATIVE_BADGE) { try { Android.setBadge(visible, text, connected); } catch (e) {} }
    badgeEl.style.display = (visible && !NATIVE_BADGE) ? 'block' : 'none';
    badgeEl.className = connected ? 'ok' : '';
    badgeText.textContent = text;
  }
  function flashBadge() {
    badgeUntil = Date.now() + 5000; renderBadge();
    clearTimeout(badgeTimer); badgeTimer = setTimeout(renderBadge, 5100);
  }
  function setBadgeMode(m) {
    if (m !== 'auto' && m !== 'always' && m !== 'never') m = 'auto';
    badgeMode = m;
    try { localStorage.setItem('tvBadge', m); } catch (e) {}
    renderBadge();
  }

  function show(el, on) { el.style.display = on ? (el === idle ? 'flex' : 'block') : 'none'; }

  function toast(t) {
    msg.textContent = t; msg.style.display = 'block';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { msg.style.display = 'none'; }, 6000);
  }

  function send(o) { try { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); } catch (e) {} }

  function clearMedia() {
    if (pageShown) { hidePage(); pageShown = false; }
    img.onerror = null;
    img.removeAttribute('src'); show(img, false);
    try { vid.pause(); } catch (e) {}
    vid.removeAttribute('src'); try { vid.load(); } catch (e) {}
    show(vid, false);
  }

  function showPage(url) {
    if (NATIVE) { try { Android.showUrl(url, curCss); } catch (e) {} }
    else { frame.src = url; show(frame, true); }
  }

  function hidePage() {
    if (NATIVE) { try { Android.hideUrl(); } catch (e) {} }
    else { frame.removeAttribute('src'); show(frame, false); }
  }

  function setCss(css) {
    curCss = css || '';
    customCss.textContent = curCss;
    if (pageShown && NATIVE) { try { Android.setCss(curCss); } catch (e) {} }
  }

  function fitLyrics() {
    var size = Math.floor(window.innerHeight * 0.12 * lyrScale);
    var maxH = window.innerHeight * 0.9, guard = 0;
    lyrIn.style.fontSize = size + 'px';
    while ((lyrIn.offsetHeight > maxH || lyrIn.scrollWidth > lyrIn.clientWidth) && size > 16 && guard++ < 90) {
      size -= 2; lyrIn.style.fontSize = size + 'px';
    }
  }

  function setLyrics(text, size) {
    lyrScale = size || 1;
    lyrOn = !!text;
    if (!text) { lyr.style.display = 'none'; lyrIn.textContent = ''; return; }
    lyrIn.textContent = text; lyr.style.display = 'flex'; fitLyrics();
  }

  window.addEventListener('resize', function () { if (lyrOn) fitLyrics(); });

  // Fundo em loop: só troca o src se o arquivo mudou (assim retoma de onde parou).
  function applyBg(b) {
    if (LITE) b = null;
    bg = b;
    if (!b) {
      bgUrl = '';
      try { bgvid.pause(); } catch (e) {}
      bgvid.removeAttribute('src'); try { bgvid.load(); } catch (e) {}
      show(bgvid, false);
      return;
    }
    bgvid.muted = b.muted !== false;
    if (b.url !== bgUrl) { bgUrl = b.url; bgvid.src = b.url; }
  }

  function updateBgVisibility() {
    var fg = cur.mode && cur.mode !== 'blank';
    if (bg && !fg) {
      show(idle, false); show(bgvid, true);
      var p = bgvid.play();
      if (p && p.catch) p.catch(function () { bgvid.muted = true; bgvid.play(); });
    } else {
      try { bgvid.pause(); } catch (e) {}
      show(bgvid, false);
      if (!fg) show(idle, !lyrOn);
    }
  }

  function apply(s) {
    // Reconexão com a mesma página aberta: não recarrega o site.
    var keepPage = (s.mode === 'url' && pageShown && cur.mode === 'url' && cur.rev === s.rev);
    cur = s;
    if (!keepPage) clearMedia();
    if (s.badge) setBadgeMode(s.badge);
    applyBg(s.bg || null);
    setLyrics(s.lyrics ? s.lyrics.text : '', s.lyrics ? s.lyrics.size : 1);
    curCss = s.css || ''; customCss.textContent = curCss;
    if (keepPage && NATIVE) { try { Android.setCss(curCss); } catch (e) {} }
    if (s.mode === 'screen' || s.mode === 'window') {
      show(idle, false); show(img, true);
      img.onerror = function () {
        setTimeout(function () {
          if (cur === s) img.src = s.url + '&x=' + Date.now();
        }, 1000);
      };
      img.src = s.url;
    } else if (s.mode === 'url') {
      show(idle, false);
      if (!keepPage) { showPage(s.page); pageShown = true; }
    } else if (s.mode === 'image') {
      show(idle, false); show(img, true); img.src = s.url;
    } else if (s.mode === 'video') {
      show(idle, false); show(vid, true);
      vid.src = s.url;
      var p = vid.play();
      if (p && p.catch) p.catch(function () { vid.muted = true; vid.play(); });
    } else {
      show(idle, true);
    }
    updateBgVisibility();
  }

  vid.addEventListener('error', function () {
    var m = 'Este vídeo não abre na TV (use MP4 H.264 ou WebM).';
    toast(m); send({ type: 'error', msg: m });
  });

  function control(c) {
    if (c.action === 'reload' && cur.mode === 'url') {
      if (NATIVE) { try { Android.reloadUrl(); } catch (e) {} }
      else if (frame.src) { frame.src = frame.src; }
      return;
    }
    if (cur.mode !== 'video') return;
    var a = c.action, v = Number(c.value);
    if (a === 'play') vid.play();
    else if (a === 'pause') vid.pause();
    else if (a === 'toggle') { if (vid.paused) vid.play(); else vid.pause(); }
    else if (a === 'seek') vid.currentTime = v;
    else if (a === 'skip') vid.currentTime = Math.max(0, vid.currentTime + v);
    else if (a === 'volume') { vid.muted = false; vid.volume = Math.min(1, Math.max(0, v)); }
    else if (a === 'mute') vid.muted = !vid.muted;
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + '/ws?role=tv');
    ws.onopen = function () {
      dot.className = 'on'; idleText.textContent = 'Conectado ao PC. Aguardando...';
      connected = true; flashBadge();
    };
    ws.onmessage = function (e) {
      var d; try { d = JSON.parse(e.data); } catch (x) { return; }
      if (d.type === 'state') apply(d.state);
      else if (d.type === 'control') control(d);
      else if (d.type === 'bg') { applyBg(d.bg); updateBgVisibility(); }
      else if (d.type === 'lyrics') { setLyrics(d.text, d.size); updateBgVisibility(); }
      else if (d.type === 'css') setCss(d.css);
      else if (d.type === 'badge') setBadgeMode(d.mode);
    };
    ws.onclose = function () {
      dot.className = ''; idleText.textContent = 'Procurando o PC...';
      connected = false; renderBadge();
      setTimeout(connect, 2000);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  setInterval(function () {
    if (cur.mode === 'video') {
      send({ type: 'progress', t: vid.currentTime || 0, d: isFinite(vid.duration) ? vid.duration : 0,
             paused: vid.paused, volume: vid.muted ? 0 : vid.volume });
    }
  }, 1000);

  renderBadge();
  connect();
})();
</script>
</body>
</html>
