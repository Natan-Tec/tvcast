<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; color: #fff;
    font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 0 40px 70px; box-sizing: border-box; }
  .logo { font-size: 64px; font-weight: bold; letter-spacing: 6px; }
  .logo b { color: #4f8cff; }
  .sub { font-size: 24px; color: #9aa4b2; margin: 8px 0 26px; }
  input { font-size: 38px; padding: 12px 20px; width: 500px; max-width: 90%; text-align: center;
    background: #171b22; color: #fff; border: 3px solid #262d39; border-radius: 12px; outline: none; }
  input:focus { border-color: #4f8cff; }
  .btns { display: flex; gap: 20px; margin-top: 22px; }
  button { font-size: 30px; padding: 12px 36px; background: #212836; color: #fff;
    border: 3px solid #262d39; border-radius: 12px; outline: none; }
  button.primary { background: #4f8cff; border-color: #4f8cff; }
  button:focus { border-color: #fff; }
  .hint { font-size: 19px; color: #6b7585; margin-top: 26px; }
  .ver { position: fixed; top: 14px; right: 20px; font-size: 16px; color: #3d4757; }
  .status { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 30px; background: #0a0d12;
    border-top: 2px solid #1b2230; font-size: 24px; text-align: center; color: #c5ccd8; }
  #dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 12px;
    background: #6b7585; vertical-align: middle; }
  #dot.ok { background: #33c27f; }
  #dot.bad { background: #e5534b; }
  #dot.wait { background: #e0b341; animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .3 } to { opacity: 1 } }
</style>
</head>
<body>
<div class="ver">v1.2</div>
<div class="wrap">
  <div class="logo">TV <b>CAST</b></div>
  <div class="sub">Conecte esta TV ao PC</div>
  <input id="ip" type="text" placeholder="IP do PC (ex.: 192.168.1.10)">
  <div class="btns">
    <button id="find" autofocus>Buscar PC</button>
    <button id="go" class="primary">Conectar</button>
  </div>
  <div class="hint">VOLTAR durante a projeção traz esta tela de volta.</div>
</div>
<div class="status"><span id="dot"></span><span id="st"></span></div>
<script>
  var ipEl = document.getElementById('ip');
  var stEl = document.getElementById('st');
  var dotEl = document.getElementById('dot');
  var qs = location.search;
  var BACK = qs.indexOf('back=1') >= 0;   // usuário apertou VOLTAR: não conecta sozinho
  var ERR = qs.indexOf('err=1') >= 0;     // a conexão falhou
  var timer = null, busy = false;

  try { ipEl.value = Android.getIp(); } catch (e) {}

  function status(text, kind) { stEl.textContent = text; dotEl.className = kind || ''; }

  function connectTo(addr) {
    status('Conectando a ' + addr + '...', 'wait');
    try { Android.connect(addr); } catch (e) { status('Erro ao conectar.', 'bad'); }
  }

  function retryLater() { clearTimeout(timer); timer = setTimeout(find, 5000); }

  window.onDiscover = function (addr) {
    busy = false;
    if (addr) {
      ipEl.value = addr;
      status('PC encontrado: ' + addr, 'ok');
      timer = setTimeout(function () { connectTo(addr); }, 500);
    } else {
      status('Não achei o PC. Abra o TV Cast no PC (mesma rede) ou digite o IP.' + (BACK ? '' : ' Tentando de novo...'), 'bad');
      if (!BACK) retryLater();
    }
  };

  function find() {
    if (busy) return;
    busy = true; clearTimeout(timer);
    status('Procurando o PC na rede...', 'wait');
    try { Android.discover(); }
    catch (e) { busy = false; status('Digite o IP do PC.', 'bad'); }
  }

  function go() {
    var v = ipEl.value.trim();
    if (!v) { status('Digite o IP primeiro ou use "Buscar PC".', 'bad'); return; }
    clearTimeout(timer);
    connectTo(v);
  }

  document.getElementById('find').onclick = function () { BACK = false; find(); };
  document.getElementById('go').onclick = go;
  ipEl.addEventListener('keydown', function (e) { clearTimeout(timer); if (e.keyCode === 13) go(); });

  if (BACK) {
    status('Escolha: buscar o PC automaticamente ou digitar o IP.', '');
  } else if (ERR) {
    status('Conexão perdida. Procurando o PC...', 'bad');
    find();
  } else {
    find();   // primeira abertura
  }
</script>
</body>
</html>
