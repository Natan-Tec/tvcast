<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("fonts/Inter-Regular.otf") format("opentype"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("fonts/Inter-SemiBold.otf") format("opentype"); }
  :root { --bg:#10141B; --field:#0B0E13; --card:#151B25; --line:#232C3A; --line-2:#34415A; --text:#E6E6E6;
    --dim:#9AA5B6; --faint:#677286; --accent:#0F9EFD; --accent-2:#017FFD; --on-accent:#FFFFFF;
    --danger:#EC0000; --ok:#2BD67B; --warn:#E0B341; --bar:#0E1116;
    --font:"Inter","Segoe UI",Roboto,Arial,sans-serif; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--font); overflow:hidden; }
  .wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 40px 70px; box-sizing:border-box; }
  .ico { height:200px; width:auto; }
  .wm { width:300px; height:auto; margin-top:6px; }
  .by { font-size:15px; font-weight:600; margin-top:6px; }
  .sub { font-size:22px; color:var(--dim); margin:22px 0 22px; }
  input { font-family:var(--font); font-size:34px; padding:10px 20px; width:500px; max-width:90%; text-align:center;
    background:var(--field); color:var(--text); border:3px solid var(--line); border-radius:12px; outline:none; }
  input::placeholder { color:var(--faint); }
  input:focus { border-color:var(--accent); }
  .btns { display:flex; gap:20px; margin-top:20px; }
  button { font-family:var(--font); font-size:28px; padding:10px 34px; background:var(--card); color:var(--text);
    border:3px solid var(--line); border-radius:12px; outline:none; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  button:focus { border-color:var(--text); }
  .hint { font-size:18px; color:var(--faint); margin-top:22px; }
  .ver { position:fixed; top:14px; right:20px; font-size:15px; color:var(--faint); }
  .status { position:fixed; left:0; right:0; bottom:0; padding:16px 30px; background:var(--bar);
    border-top:2px solid var(--line); font-size:22px; text-align:center; color:var(--dim); }
  #dot { display:inline-block; width:16px; height:16px; border-radius:50%; margin-right:12px; background:var(--faint); vertical-align:middle; }
  #dot.ok { background:var(--ok); }
  #dot.bad { background:var(--danger); }
  #dot.wait { background:var(--warn); animation:pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity:.3 } to { opacity:1 } }
</style>
</head>
<body>
<div class="ver">v1.3</div>
<div class="wrap">
  <img class="ico" src="img/icon.svg" alt="">
  <img class="wm" src="img/wordmark.svg" alt="TV CAST">
  <div class="by">By Pixel Shell</div>
  <div class="sub">Conecte esta TV ao PC</div>
  <input id="ip" type="text" placeholder="IP do PC (ex.: 192.168.1.10)">
  <div class="btns">
    <button id="find" autofocus>Buscar PC</button>
    <button id="go" class="primary">Conectar</button>
  </div>
  <div class="hint">VOLTAR durante a projeção traz esta tela de volta.</div>
</div>
<div class="status"><span id="dot"></span><span id="st"></span></div>
<script>
  var ipEl = document.getElementById('ip');
  var stEl = document.getElementById('st');
  var dotEl = document.getElementById('dot');
  var qs = location.search;
  var BACK = qs.indexOf('back=1') >= 0;   // usuário apertou VOLTAR: não conecta sozinho
  var ERR = qs.indexOf('err=1') >= 0;     // a conexão falhou
  var timer = null, busy = false;

  try { ipEl.value = Android.getIp(); } catch (e) {}

  function status(text, kind) { stEl.textContent = text; dotEl.className = kind || ''; }

  function connectTo(addr) {
    status('Conectando a ' + addr + '...', 'wait');
    try { Android.connect(addr); } catch (e) { status('Erro ao conectar.', 'bad'); }
  }

  function retryLater() { clearTimeout(timer); timer = setTimeout(find, 5000); }

  window.onDiscover = function (addr) {
    busy = false;
    if (addr) {
      ipEl.value = addr;
      status('PC encontrado: ' + addr, 'ok');
      timer = setTimeout(function () { connectTo(addr); }, 500);
    } else {
      status('Não achei o PC. Abra o TV Cast no PC (mesma rede) ou digite o IP.' + (BACK ? '' : ' Tentando de novo...'), 'bad');
      if (!BACK) retryLater();
    }
  };

  function find() {
    if (busy) return;
    busy = true; clearTimeout(timer);
    status('Procurando o PC na rede...', 'wait');
    try { Android.discover(); }
    catch (e) { busy = false; status('Digite o IP do PC.', 'bad'); }
  }

  function go() {
    var v = ipEl.value.trim();
    if (!v) { status('Digite o IP primeiro ou use "Buscar PC".', 'bad'); return; }
    clearTimeout(timer);
    connectTo(v);
  }

  document.getElementById('find').onclick = function () { BACK = false; find(); };
  document.getElementById('go').onclick = go;
  ipEl.addEventListener('keydown', function (e) { clearTimeout(timer); if (e.keyCode === 13) go(); });

  if (BACK) {
    status('Escolha: buscar o PC automaticamente ou digitar o IP.', '');
  } else if (ERR) {
    status('Conexão perdida. Procurando o PC...', 'bad');
    find();
  } else {
    find();   // primeira abertura
  }
</script>
</body>
</html>
