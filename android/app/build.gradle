plugins {
    id 'com.android.application'
}

android {
    namespace 'com.natantec.tvcast'
    compileSdk 34

    defaultConfig {
        applicationId "com.natantec.tvcast"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Chave de debug fixa no repositório: assim cada APK novo instala por cima do anterior.
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
